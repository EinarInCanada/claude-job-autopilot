  #   search_url: "https://www.ziprecruiter.com/jobs-search?search={keywords}&location={location}"
  #   apply_type: "in_app"
  #
  # - name: "SimplyHired"
  #   search_url: "https://www.simplyhired.com/search?q={keywords}&l={location}"
