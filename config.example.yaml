# ── Platform Rotation (Mon–Fri) ──────────────────────────────
# Controls the order platforms and search directions are processed each day.
# Both lists rotate across the week so every platform gets equal priority.
#
# IMPORTANT: Only include platform names that exist in `platforms` above.
# If you add or remove platforms, update every day's list here to match.
# If you only have 2 platforms, just list those 2 each day.
#
# Direction keys must match keys defined in `search_directions` above.

platform_rotation:
  Monday:
    platforms: ["LinkedIn", "Indeed", "Glassdoor", "Monster"]
    directions: ["Direction1", "Direction2", "Direction3", "Direction4", "Direction5"]
  Tuesday:
    platforms: ["Indeed", "Glassdoor", "Monster", "LinkedIn"]
    directions: ["Direction2", "Direction3", "Direction4", "Direction5", "Direction1"]
  Wednesday:
    platforms: ["Glassdoor", "Monster", "LinkedIn", "Indeed"]
    directions: ["Direction3", "Direction4", "Direction5", "Direction1", "Direction2"]
  Thursday:
    platforms: ["Monster", "LinkedIn", "Indeed", "Glassdoor"]
    directions: ["Direction4", "Direction5", "Direction1", "Direction2", "Direction3"]
  Friday:
    platforms: ["LinkedIn", "Monster", "Indeed", "Glassdoor"]
    directions: ["Direction5", "Direction1", "Direction2", "Direction3", "Direction4"]

# ── Public Holidays to Skip ──────────────────────────────────
# Add your local public holidays in YYYY-MM-DD format.
# The skill skips these days automatically.
# Add a new `dates_YYYY` block each year — key must match the actual calendar year.
# The skill reads whichever block matches today's year automatically.
holidays:
  dates_2025:
    - "2025-01-01"   # New Year's Day
    # - "2025-XX-XX" # Add your local holidays here

  dates_2026:
    - "2026-01-01"   # New Year's Day
    # - "2026-XX-XX" # Add your local holidays here

  # Add more years as needed:
  # dates_2027:
  #   - "2027-01-01"

# ── External ATS Password Pattern ────────────────────────────
# Used when creating new accounts on external career portals.
# {CompanyName} is replaced with the actual company name at runtime.
ats_password_pattern: "YourName@{CompanyName}{Year}!"
# {CompanyName} → replaced with the actual company name at runtime
# {Year}        → replaced with the current calendar year at runtime
# Example result: "YourName@Shopify2025!"  ({Year} = current calendar year at runtime)

# ── Application Limits ───────────────────────────────────────
# How many jobs to apply to per platform per day.
# Default: 5 per platform. With 4 platforms that is up to 20 applications/day.
# Lower this if you want a slower, more selective pace.
# There is no upper limit, but most platforms will run out of qualifying
# fresh listings before you reach more than 10–15 per day.
applications_per_platform: 5

# ── CAPTCHA Handling ─────────────────────────────────────────
# How many times to attempt a CAPTCHA before giving up.
#
# Default: 1 — attempt once, then leave the tab open for you to complete manually.
# This is the recommended setting. Multiple retries risk triggering bot-detection,
# getting your IP flagged, or causing the form session to expire.
#
# You may increase this if you find CAPTCHAs are solvable with a second try
# (e.g., simple checkbox reCAPTCHA). Use with caution.
#
# Set to 0 for unlimited attempts — NOT recommended. Claude will keep retrying
# indefinitely, which will slow down the run and may get your account flagged.
captcha_max_attempts: 1

# ── Schedule ─────────────────────────────────────────────────
# Default: every weekday at 9:00 AM in your local timezone.
# Change `time` to any 24h time that works for you.
# Change `days` to run on fewer days (e.g., ["Monday", "Wednesday", "Friday"]).
schedule:
  time: "09:00"                     # Local time, 24h format — e.g., "08:30" / "12:00"
  timezone: ""                      # e.g., "America/New_York" / "Europe/London" / "Asia/Tokyo"
  days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
