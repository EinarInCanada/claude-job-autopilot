  #   search_url: "https://www.workopolis.com/jobsearch/find-jobs?ak={keywords}&l={location}"
  #   apply_type: "external_ats"

  # Germany / Europe
  # - name: "StepStone"
  #   search_url: "https://www.stepstone.de/jobs/{keywords}/{location}"
  #   apply_type: "external_ats"

  # India
  # - name: "Naukri"
  #   search_url: "https://www.naukri.com/{keywords}-jobs-in-{location}"
  #   apply_type: "external_ats"

  # France
  # - name: "HelloWork"
  #   search_url: "https://www.hellowork.com/en-ca/jobs/?k={keywords}&l={location}"
  #   apply_type: "external_ats"

  # USA
